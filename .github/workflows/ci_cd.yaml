name: CI/CD

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  ci_cd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 22

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run tests
        run: make test

      - name: Build uber JAR
        run: make build

      - name: Setup WARP
        uses: fscarmen/warp-on-actions@v1.4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -t ed25519 ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        if: ${{ github.ref == 'refs/heads/main' }}
        run: scp target/app.jar ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/app
